<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="DARIMIPAN — Straightening the Wrinkles of the World.">
  <title>DARIMIPAN</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --blue: #071cf2;
      --yellow: #ffc400;
      --ink: #080808;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100% - 48px, 900px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 3.4vw, 48px);
      transform: translateY(-1px);
    }

    .mark {
      display: block;
      flex: 0 0 auto;
      width: clamp(76px, 8vw, 110px);
      height: auto;
    }

    .wordmark {
      min-width: 0;
    }

    h1 {
      margin: 0 0 17px;
      font-size: clamp(43px, 5.6vw, 76px);
      line-height: .95;
      font-weight: 400;
      letter-spacing: .005em;
      white-space: nowrap;
    }

    .tagline {
      margin: 0 0 2px 4px;
      font-size: clamp(17px, 2.3vw, 31px);
      line-height: 1.2;
      letter-spacing: .075em;
      white-space: nowrap;
      font-weight: 400;
    }

    .korean {
      margin: 0 0 0 4px;
      font-family: "Batang", "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(18px, 2.3vw, 30px);
      line-height: 1.25;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      main {
        flex-direction: column;
        gap: 22px;
        text-align: center;
      }
      .mark { width: 78px; }
      h1 { font-size: clamp(38px, 11vw, 58px); margin-bottom: 12px; }
      .tagline, .korean {
        margin-left: 0;
        white-space: normal;
      }
      .tagline { font-size: clamp(15px, 4vw, 21px); letter-spacing: .045em; }
      .korean { font-size: 19px; }
    }
  </style>
</head>
